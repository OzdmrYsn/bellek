<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Bellek</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161616'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%23f77f20' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23fafafa'/%3E%3C/svg%3E" />
    <script>
      // Tema, ilk boyamadan önce uygulanır ki sayfa açılırken renk sıçraması olmasın.
      try {
        var saved = localStorage.getItem('bellek.tema');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
